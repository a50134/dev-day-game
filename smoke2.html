<!doctype html>
<meta charset="utf-8">
<title>smoke2</title>
<pre id="out">running…</pre>
<script type="module">
// 冒煙測試 2：測驗及格 → 辦公室出現 💬 小事件；以及主線 需求→設計→技術→回座位→實作 的串接
import { COURSES } from './src/courses.js';
const log = [];
const show = () => (out.textContent = log.join('\n'));
const ok = (c, m) => { log.push((c ? 'OK   ' : 'FAIL ') + m); show(); };
addEventListener('unhandledrejection', (e) => { log.push('ERROR ' + (e.reason?.stack || e.reason)); show(); });
addEventListener('error', (e) => { log.push('ERROR ' + e.message); show(); });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.style.cssText = 'width:1200px;height:900px';
document.body.append(f);
const open = async (save) => {
  localStorage.clear();
  if (save) localStorage.setItem('ddg-save', JSON.stringify(save));
  f.src = 'index.html?view=2d&r=' + Math.random();
  await new Promise((r) => (f.onload = r));
  await wait(700);
};
const d = () => f.contentDocument, w = () => f.contentWindow;
const q = (s) => d().querySelector(s), qa = (s) => [...d().querySelectorAll(s)];
const click = async (el) => { el.click(); await wait(150); };
const key = async (k) => { d().body.dispatchEvent(new (w().KeyboardEvent)('keydown', { key: k, bubbles: true })); await wait(50); };
const btnText = (t) => qa('button').find((b) => b.textContent.includes(t));
const px = () => [parseInt(q('#me').style.left.match(/\*(\d+)/)[1]), parseInt(q('#me').style.top.match(/\*(\d+)/)[1])];
const walk = async (tx, ty) => { // 先橫向再縱向（地圖中間走道是 y=5）
  for (let i = 0; i < 80 && (px()[0] !== tx || px()[1] !== ty); i++) {
    const [x, y] = px();
    if (y !== 5 && x !== tx) await key(y < 5 ? 's' : 'w');
    else if (x !== tx) await key(x < tx ? 'd' : 'a');
    else await key(y < ty ? 's' : 'w');
  }
};

// ---- A. 章節測驗 → 小事件 ----
const ch = COURSES[0].chapters[0];
await open({ phase: 'classroom', back: 'office', prog: { ts1: true, ts2: true, ts3: true }, pos: { x: 5, y: 5 }, goal: 'req' });
ok(q('h1')?.textContent.includes('教室'), 'A 載入存檔直接進教室');
await click(btnText('開始測驗'));
for (let i = 0; i < ch.quiz.length; i++) {
  const qz = ch.quiz[i];
  if (qz.type === 'choice') await click(qa('.qc .opt')[qz.answer]);
  else await click(qa('.qc .chip').find((c) => c.textContent === qz.answers[0]));
}
ok(q('.bubble')?.textContent.includes('及格'), 'A 測驗全對 → 及格');
await click(btnText('回教室'));
ok(btnText('開始') || qa('button').some((b) => b.textContent === '開始'), 'A 及格後小專案解鎖');
await click(btnText('返回'));
ok(q('.map') && qa('.mark').some((m) => m.textContent === '💬'), 'A 辦公室出現 💬 事件標記');
await walk(7, 5); await key('s'); // 阿宅在 (7,6)：站在 (7,5) 旁
ok(px()[0] === 7, 'A 站到阿宅旁邊 ' + px());
await key(' ');
ok(q('.ovbox')?.textContent.includes('any'), 'A 阿宅的事件對話出現');
await click(qa('.ovbtn button')[0]);
ok(q('.map') && !qa('.mark').some((m) => m.textContent === '💬'), 'A 選完選項後 💬 消失');

// ---- B. 主線串接 ----
await open(null);
await click(btnText('進入公司'));
await walk(3, 3); await key(' ');
ok(q('h2')?.textContent.includes('需求'), 'B 找 PM → 需求會議');
await click(btnText('決定了'));
ok(q('.map'), 'B 回辦公室');
await walk(6, 4); // 設計師在 (6,2)，站 (6,3) 旁；走道 y=5 往上走
await key('w'); await key('w');
await key(' ');
ok(q('h2')?.textContent.includes('設計師'), 'B 找設計師 → 討論風格 ' + (q('h2')?.textContent || ''));
await click(btnText('請她出設計圖'));
await click(qa('.opt')[0]); await click(qa('.opt')[0]);
ok(q('.map'), 'B 設計稿兩輪後回辦公室');
await walk(10, 5); await key('d'); await key(' ');
ok(q('h2')?.textContent.includes('技術'), 'B 找組長 → 技術選擇 ' + (q('h2')?.textContent || ''));
await click(btnText('開始實作'));
ok(q('.map'), 'B 回辦公室準備回座位');
await walk(3, 6); await key(' ');
ok(q('.split') && q('#edbox'), 'B 走到座位 → 開始實作畫面');
// ---- C. 標頭的教室入口（任何畫面都能進、能回） ----
await open(null);
await click(q('#classbtn'));
ok(q('h1')?.textContent.includes('教室') && qa('button').some((b) => b.textContent === '上課'), 'C 公司選擇畫面也能從標頭進教室');
ok(qa('button').filter((b) => b.textContent === '上課').length === 35, 'C 七門課（TypeScript、Tailwind、React、Vue、Node.js、Python、串接 API）共 35 堂課都能直接上，不必照順序');
ok(['Node.js 後端', 'Python', '串接 API'].every((n) => qa('h2').some((h) => h.textContent.includes(n))), 'C 教室裡有 Node.js 後端、Python、串接 API 三門新課');
const twBtn = qa('.card').find((c) => c.textContent.includes('Tailwind')).querySelector('button');
await click(twBtn);
ok(q('h2')?.textContent.includes('Tailwind 是什麼'), 'C 可以進 Tailwind 第 1 堂');
await click(btnText('回教室'));
await click(btnText('返回'));
ok(q('h1')?.textContent.includes('前端工程師的一天'), 'C 返回回到原本的畫面');
document.title = log.some((l) => !l.startsWith('OK')) ? 'FAIL' : 'PASS';
log.push(document.title === 'PASS' ? 'ALL OK' : 'FAILED'); show();
</script>
