<!-- 所有套件都用本機檔案（vendor/），不靠外部 CDN。react 的三個名字指到同一個檔案，才會只有一份 React。
     Tailwind 瀏覽器版不在這裡載入：src/tw-preview.js 看到 CSS 有 @import "tailwindcss" 才載入（沒有這行，真的專案也不會有 Tailwind）。 -->
<script type="importmap">
{ "imports": {
  "react": "./vendor/react-all.js",
  "react/jsx-runtime": "./vendor/react-all.js",
  "react-dom/client": "./vendor/react-all.js",
  "axios": "./vendor/axios.js",
  "sucrase": "./vendor/sucrase.js"
} }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/tw-preview.js"></script>
</body>
