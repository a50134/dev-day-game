<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>前端工程師的一天</title>
<style>
  :root { --bg: #f7f7f8; --fg: #1d1d1f; --card: #fff; --line: #ddd; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141416; --fg: #eee; --card: #1f1f23; --line: #333; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Noto Sans TC", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; }
  .stat i { display: inline-block; width: 70px; height: 8px; background: var(--line); border-radius: 4px; position: relative; vertical-align: middle; }
  .stat i::after { content: ""; position: absolute; inset: 0; width: var(--w); background: var(--accent); border-radius: 4px; }
  section { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .card.lock { opacity: .5; }
  label { display: block; margin: 6px 0; }
  button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); cursor: pointer; margin: 4px 4px 4px 0; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.opt { display: block; text-align: left; }
  .say { background: var(--card); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 4px; }
  .mock { background: #fff; color: #222; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .mock span { display: inline-block; color: #fff; padding: 4px 12px; }
  .split { display: grid; grid-template-columns: 230px 1fr; gap: 16px; }
  section:has(.split) { max-width: none; padding: 8px 12px; } .side { font-size: 14px; }
  .ticket { background: var(--card); border: 1px dashed var(--line); padding: 10px; border-radius: 6px; }
  .work { display: grid; grid-template-rows: 280px 78vh; gap: 8px; } /* 頁面可往下捲：編輯器固定高，對照區吃滿一個螢幕 */
  .cmp > figure { height: 100%; } iframe, #spec, #twpane { min-height: 0; overflow: auto; }
  textarea { width: 100%; box-sizing: border-box; font: 13px/1.5 ui-monospace, Consolas, monospace; background: #1e1e1e; color: #ddd; border: 0; border-radius: 6px; padding: 10px; tab-size: 2; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 0; }
  figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
  figcaption { font-size: 13px; opacity: .7; }
  iframe { width: 100%; flex: 1; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .ed { display: flex; flex-direction: column; min-height: 0; } #edbox { flex: 1; min-height: 0; } .cmbox { height: 100%; } .cmbox[hidden] { display: none; }
  .cmbox textarea { width: 100%; height: 100%; } .tip { font-size: 13px; opacity: .8; } kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .hint { font-size: 13px; } .hint pre { background: #1e1e1e; color: #ddd; padding: 6px 8px; border-radius: 4px; overflow: auto; font-size: 12px; margin: 4px 0; } .hint code { font-size: 12px; } .hint ol { padding-left: 18px; }
  header { align-items: center; }
  header .hm { margin-left: auto; padding: 2px 12px; font-size: 13px; background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; } header .hm + .rs { margin-left: 0; }
  header .rs { margin-left: auto; padding: 2px 10px; font-size: 13px; } header .rs2 { padding: 2px 10px; font-size: 13px; }
  /* 可愛風：柔和配色、大圓角、對話框 */
  :root { --bg: #fff6ef; --accent: #ff6f91; --line: #f2d9cc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1618; --card: #2a2024; --line: #4a3840; } }
  .card { border-radius: 16px; box-shadow: 0 2px 0 var(--line); } button { border-radius: 999px; } button.opt { border-radius: 14px; }
  .say, .ticket { border-radius: 14px; }
  .dlg { display: flex; align-items: flex-end; gap: 10px; margin: 12px 0; }
  .dlg .avatar { flex: none; background: #fff0e6; border-radius: 50%; border: 3px solid var(--line); }
  .bubble { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 8px 14px; max-width: 640px; }
  .bubble::before { content: ""; position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: var(--card); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
  .bubble b { font-size: 13px; color: var(--accent); } .bubble p { margin: 2px 0 0; }
  .side .dlg { flex-direction: column; align-items: flex-start; } .side .bubble::before { display: none; } .side .dlg .avatar { width: 64px; height: 64px; }
  header .avatar { width: 36px; height: 36px; background: #fff0e6; border-radius: 50%; }
  .work1 { height: 78vh; } #tsbox { height: 100%; }
  /* 辦公室地圖 */
  .map { --t: 46px; position: relative; width: calc(var(--w) * var(--t)); height: calc(var(--h) * var(--t)); margin: 8px auto; border: 4px solid #d9b99b; border-radius: 18px; overflow: hidden;
    background: repeating-conic-gradient(#ffe9d6 0 25%, #fff3e6 0 50%) 0 0 / calc(var(--t) * 2) calc(var(--t) * 2); }
  .ent { position: absolute; width: var(--t); height: var(--t); display: flex; align-items: center; justify-content: center; }
  .ent .emo { font-size: 30px; } .ent .avatar { width: 44px; height: 44px; } .ent.me { z-index: 5; transition: left .12s linear, top .12s linear; }
  .ent.me .avatar { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 2px 0 #ff6f91); }
  .ent.npc::before { content: ""; position: absolute; left: 4px; right: 4px; bottom: 2px; height: 16px; background: #d9a47a; border-radius: 6px; z-index: -1; }
  .nm { position: absolute; bottom: -4px; font-size: 10px; background: rgba(255,255,255,.85); color: #444; border-radius: 6px; padding: 0 4px; white-space: nowrap; }
  .mark { position: absolute; top: -26px; font-size: 16px; background: #fff; border-radius: 12px; padding: 0 4px; box-shadow: 0 2px 4px rgba(0,0,0,.25); animation: bob 1s ease-in-out infinite; z-index: 6; } @keyframes bob { 50% { transform: translateY(-5px); } }
  #ovl { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 9; } #ovl[hidden] { display: none; }
  .ovbox { background: var(--card); border-radius: 18px; padding: 8px 14px 12px; max-width: 520px; } .ovbtn { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .muted { font-size: 13px; opacity: .8; margin: 6px 0 0; } .chip { padding: 2px 12px; font-family: ui-monospace, Consolas, monospace; }
  /* 上班日 */
  .wd { display: grid; grid-template-columns: minmax(260px, 1fr) 2fr; gap: 16px; } @media (max-width: 800px) { .wd { grid-template-columns: 1fr; } }
  .board { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; align-self: start; } .board h4 { margin: 4px 0; }
  .tk { border-top: 1px solid var(--line); padding: 8px 0; } .tk.done { opacity: .6; } .tkt { font-weight: 600; margin-top: 2px; }
  .tag { font-size: 12px; border-radius: 8px; padding: 0 6px; color: #fff; } .tag.sS { background: #4fb986; } .tag.sM { background: #f29b1d; } .tag.sL { background: #ff6f91; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; margin: 4px 0; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
  .timeline { display: flex; gap: 2px; } .timeline .tl { flex: 1; height: 16px; }
  .tl { border-radius: 3px; background: var(--line); display: inline-block; }
  .legend { font-size: 12px; margin: 4px 0 8px; } .legend .tl { width: 14px; height: 10px; vertical-align: middle; margin-left: 8px; }
  .tl.focus { background: #6ccf9c; } .tl.meet { background: #7c9cff; } .tl.int { background: #ff6f91; } .tl.lunch { background: #ffd166; } .tl.rest { background: #bde0fe; } .tl.now { background: #fff; outline: 2px solid var(--accent); }
  .pick { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; margin: 8px 0; } .warn { color: #d97706; } .state { font-weight: 600; }
  .tbl .tl { width: 14px; height: 10px; vertical-align: middle; }
  .tbl { border-collapse: collapse; } .tbl td { padding: 2px 16px 2px 0; }
  .tl.sick { background: #b0a3c9; } .tk.late { border-left: 4px solid #ff6f91; padding-left: 8px; }
  .daybar { display: flex; gap: 4px; margin: 6px 0; } .daybar i { flex: 1; text-align: center; font-style: normal; font-size: 12px; border-radius: 6px; background: var(--line); padding: 1px 0; } .daybar i.on { background: var(--accent); color: #fff; } .daybar i.cur { outline: 2px solid var(--accent); background: #fff; }
  .proj { background: #fff7e6; } .bar.big { height: 14px; } .hbar { display: flex; height: 12px; } .hbar i { display: block; height: 12px; } .hbar .big { background: var(--accent); } .hbar .oth { background: #cfc3b8; }
  .warn-card { background: #fff0f0; }
  .map3d { width: min(100%, 940px) !important; height: 500px !important; background: #fff3e6; --t: 1px; } .map3d canvas { width: 100%; height: 100%; display: block; } .map3d.mini { width: min(100%, 560px) !important; height: 190px !important; margin: 0 auto 8px; } .vt { padding: 2px 10px; font-size: 12px; margin-left: 8px; }
  .goal { text-align: center; } .prompt { text-align: center; min-height: 1.6em; }
  .dpad { display: flex; flex-direction: column; align-items: center; } .dpad div { display: flex; gap: 4px; } .dpad button { min-width: 56px; }
  /* 教室 */
  .row { padding: 4px 0; } .row.lock { opacity: .45; } .dots { display: flex; gap: 6px; margin: 6px 0; } .dots i { width: 28px; height: 8px; border-radius: 4px; background: var(--line); } .dots i.on { background: var(--accent); } .dots i.cur { background: #ffb3c3; }
  .qc { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 10px 14px; margin: 8px 0; } .qc input { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; }
  pre { background: #1e1e1e; color: #ddd; padding: 8px 10px; border-radius: 10px; overflow: auto; font-size: 13px; } .bubble code, .qc code, .side code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .exbox { display: grid; grid-template-rows: 1fr auto auto; gap: 8px; height: 100%; } .exbox:has(> .cmp) { grid-template-rows: 34% auto 1fr auto; } .exbox .exed { min-height: 0; } .exbox .cmp { min-height: 0; } .exres { max-height: 22vh; overflow: auto; font-size: 13px; }
  .exbox:has(> .exout:not([hidden])) { grid-template-rows: 1fr auto auto auto; } .exout { margin: 0; max-height: 14vh; overflow: auto; background: #2b2b3a; color: #e8e8f0; padding: 8px 10px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; }
  .exbar { display: flex; flex-wrap: wrap; gap: 8px; } .exbar .big { font-size: 16px; padding: 8px 22px; font-weight: 700; }
  .tabs button { margin: 0 2px 0 0; padding: 2px 10px; font-size: 13px; } .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cmp > figure > [hidden] { display: none; }
  #spec, #twpane { flex: 1; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 13px; line-height: 1.5; }
  .spec h4 { margin: 4px 0; } .spec h4 small { font-weight: 400; opacity: .6; } .spec h5 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  .spec code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 4px; font-size: 12px; }
  .spec table { border-collapse: collapse; } .spec td { padding: 2px 12px 2px 0; }
  .sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .sw i { display: block; height: 28px; border: 1px solid var(--line); border-radius: 4px; } .sw b, .sw code, .sw small { display: block; }
  .comp { border-top: 1px solid var(--line); padding: 6px 0; } .comp ul { margin: 4px 0 0; padding-left: 18px; }
  .fail { color: #dc2626; padding-left: 18px; } .ok { color: #16a34a; font-weight: 700; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
.hsteps{margin-top:8px;font-size:13px}.hsteps details{margin:4px 0;background:rgba(255,255,255,.07);border-radius:6px;padding:4px 8px}.hsteps summary{cursor:pointer;font-weight:bold}.hsteps pre{background:#1e1e1e;color:#ddd;padding:6px 8px;border-radius:4px;overflow:auto;font-size:12px;margin:4px 0;white-space:pre-wrap}.hsteps.demo{background:rgba(120,180,255,.12);border-radius:6px;padding:6px 8px;margin-top:8px}.hsteps.demo summary{cursor:pointer}.hsteps code{font-size:12px}

  .lab { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 10px 0; } .lab h4 { margin: 0 0 4px; }
  .vbtns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; } .labout { background: rgba(0,0,0,.18); border-radius: 10px; padding: 8px 12px; margin: 8px 0; } .labout pre { margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
  .labline { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 6px 0; } .labline.off { opacity: .75; border-style: dashed; } .labline code { font-size: 13px; word-break: break-all; } .labline .why { font-size: 13px; margin: 4px 0 0 24px; } .gone { color: #ff8a80; font-size: 13px; margin: 4px 0 0 24px; }
  .pool { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; } button.blk { text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: 13px; border-radius: 10px; } .mline { cursor: pointer; padding: 4px 8px; border-left: 3px solid var(--line); margin: 4px 0; } .mline .why { font-size: 13px; margin-left: 22px; cursor: default; }
  .blk-code select { font: inherit; background: #333; color: #ffd666; border-radius: 6px; padding: 1px 4px; } .bmsg { margin: 6px 0; }
  .tbl { border-collapse: collapse; font-size: 13px; margin: 8px 0; width: 100%; } .tbl th, .tbl td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; } .tbl th { background: rgba(255,255,255,.08); }
  /* 手機版：窄螢幕單欄、按鈕好按、地圖依螢幕縮放 */
  .dpad button, .ovbtn button { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  @media (max-width: 640px) {
    body { font-size: 15px; -webkit-text-size-adjust: 100%; }
    header { position: static; gap: 6px 10px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); }
    header .stat { font-size: 12px; } header .stat b { font-weight: 600; } .stat i { width: 26px; }
    header .avatar { width: 28px; height: 28px; }
    header .hm, header .rs, header .rs2 { font-size: 12px; min-height: 32px; margin: 0; }
    header .hm, header .rs, header .rs2 { margin-left: 0; padding: 4px 10px; }
    section, section:has(.split) { padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    button { min-height: 40px; }
    input, textarea, select { font-size: 16px; }
    .cm-content, .cm-gutters { font-size: 16px !important; }
    .cm-scroller { font-size: 16px !important; }
    h1 { font-size: 22px; } h2 { font-size: 19px; }
    .bubble { max-width: none; } .ovbox { max-width: calc(100vw - 32px); max-height: 90%; overflow: auto; }
    /* 2D 地圖：格子寬度 = 螢幕寬 / 欄數 */
    .map:not(.map3d) { --t: calc((100vw - 28px) / var(--w)); border-width: 3px; border-radius: 12px; }
    .map:not(.map3d) .ent .emo { font-size: calc(var(--t) * .62); } .map:not(.map3d) .ent .avatar { width: calc(var(--t) * .92); height: calc(var(--t) * .92); }
    .map:not(.map3d) .nm { font-size: 8px; } .map:not(.map3d) .mark { top: calc(var(--t) * -.5); font-size: 12px; }
    .map3d { height: min(62vh, 440px) !important; border-radius: 12px; }
    .map3d.mini { height: 150px !important; }
    .goal small { display: block; } .prompt { font-size: 14px; }
    .dpad { flex-direction: row; flex-wrap: nowrap; justify-content: center; gap: 6px; margin: 6px -10px 0; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); position: sticky; bottom: 0; z-index: 20; background: linear-gradient(transparent, var(--bg) 25%); }
    .dpad div { display: contents; }
    section:has(.dpad) > h1, .goal small { display: none; }
    .dpad button { flex: 1; min-width: 0; max-width: 72px; min-height: 52px; font-size: 20px; margin: 0; padding: 0; border-radius: 18px; }
    .dpad button[data-a="2"] { order: 1; } .dpad button[data-a="0"] { order: 2; } .dpad button[data-a="1"] { order: 3; } .dpad button[data-a="3"] { order: 4; }
    .dpad button.primary { order: 5; flex: 1.5; max-width: 110px; font-size: 16px; }
    /* 寫程式畫面：說明 → 編輯器 → 設計稿 / 成果，由上往下捲 */
    .work { grid-template-rows: 340px auto; } .cmp { grid-template-columns: 1fr; gap: 12px; } .cmp > figure { height: 70vh; min-height: 360px; }
    .work1 { height: 72vh; min-height: 420px; } .exbox .exres { max-height: 30vh; }
    .daybar i { font-size: 11px; }
  }
  @media (hover: none) and (pointer: coarse) { kbd { display: none; } }
</style>
</head>
