<!doctype html>
<meta charset="utf-8">
<title>smoke-guided-vu</title>
<pre id="out">running…</pre>
<script type="module">
// 手把手專案「待辦清單」（Vue）：每個單元起始程式不通過、參考解答通過
import { GUIDED } from './src/guided-vu.js';
import { mountLive, runLive } from './src/practice.js';
const lines = []; let bad = 0;
const rep = (ok, m) => { if (!ok) bad++; lines.push((ok ? 'OK   ' : 'FAIL ') + m); out.textContent = lines.join('\n'); };
addEventListener('unhandledrejection', (e) => { bad++; lines.push('ERROR ' + (e.reason?.stack || e.reason)); out.textContent = lines.join('\n'); });
const mine = document.createElement('iframe'); mine.style.cssText = 'width:700px;height:420px'; document.body.append(mine);
const ch = GUIDED.chapter;
rep(ch.lessons.length >= 6 && ch.lessons.length <= 8 && !!GUIDED.event.options, `單元數 ${ch.lessons.length}，有事件`);
for (const l of ch.lessons) {
  rep(l.steps.length === 3 && l.steps.every((s) => s.check.options[s.check.answer]), `${l.id} 有 3 步且每步有選擇題答案`);
  const e = l.final;
  const must = (code) => (e.must || []).filter((m) => !m.re.test(code)).length;
  await mountLive(mine, e.kind, e.starter);
  const f0 = (await runLive(mine, e)).length + must(e.starter);
  await mountLive(mine, e.kind, e.solution);
  const f1 = [...(await runLive(mine, e)), ...Array(must(e.solution)).fill('must')];
  rep(f0 > 0 && f1.length === 0, `${l.id}　起始不通過 ${f0} 項　解答 ${JSON.stringify(f1)}`);
}
out.textContent = lines.join('\n') + '\n' + (bad ? 'FAILED ' + bad : 'ALL OK');
</script>
