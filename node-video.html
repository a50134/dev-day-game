<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Node.js 影片教學</title>
<style>
  :root { --bg: #fff6ef; --fg: #1d1d1f; --card: #fff; --line: #f2d9cc; --accent: #ff6f91; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1618; --fg: #eee; --card: #2a2024; --line: #4a3840; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 "Noto Sans TC", system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 10px 12px 150px; }
  a { color: var(--accent); }
  h1 { font-size: 20px; margin: 4px 0; } h2 { font-size: 17px; margin: 10px 0 2px; }
  button, select { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--fg); cursor: pointer; min-height: 40px; touch-action: manipulation; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  /* 選第幾部：可以左右滑 */
  #eps { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; }
  #eps button { flex: none; border-radius: 14px; text-align: left; line-height: 1.3; padding: 6px 12px; }
  #eps button small { display: block; font-size: 12px; opacity: .75; }
  #eps button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #count { font-size: 13px; opacity: .75; }
  .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; } #bar { height: 100%; background: var(--accent); transition: width .3s; }
  /* 螢幕：大字卡／編輯器／終端機／瀏覽器 */
  #screen { display: grid; gap: 8px; }
  #slide { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 22px 14px; text-align: center; }
  #slide p { margin: 6px 0; } #slide .big { font-size: 20px; font-weight: 700; }
  .pane { border-radius: 12px; overflow: hidden; border: 1px solid #333; } .pane[hidden], #slide[hidden] { display: none; }
  .pane header { background: #2d2d2d; color: #ccc; font: 12px/1 ui-monospace, Consolas, monospace; padding: 8px 10px; }
  #code, #tout { margin: 0; background: #1e1e1e; color: #ddd; font: 13px/1.6 ui-monospace, Consolas, monospace; padding: 8px 10px; overflow: auto; max-height: 46vh; white-space: pre; }
  #code div.new { background: #2f3b2a; box-shadow: inset 3px 0 #6ccf9c; margin: 0 -10px; padding: 0 10px; } #code i { color: #7f8c8d; font-style: normal; }
  #tout { background: #101418; max-height: 30vh; white-space: pre-wrap; } #tout .cmd { color: #6ccf9c; }
  #web header { background: #e9e9ee; color: #333; } #url { background: #fff; border-radius: 999px; padding: 4px 10px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #page { background: #fff; color: #222; padding: 12px; min-height: 70px; } #page code { font: 13px ui-monospace, Consolas, monospace; word-break: break-all; }
  .fake { display: inline-block; border: 1px solid #bbb; border-radius: 6px; padding: 2px 16px; margin-right: 6px; color: #888; font-size: 14px; } .fake.btn { background: #eee; color: #222; }
  /* 字幕與控制列固定在下面，手機單手就能按 */
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 2px solid var(--line); padding: 8px 12px max(8px, env(safe-area-inset-bottom)); }
  footer > div { max-width: 820px; margin: 0 auto; }
  #say { margin: 0 0 8px; min-height: 3.2em; font-size: 16px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .ctl .primary { flex: 1; min-width: 96px; }
  .ctl2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 13px; } .ctl2 button, .ctl2 select { min-height: 32px; padding: 2px 10px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>🎬 Node.js 影片教學</h1>
  <p style="margin:0;font-size:14px">按「播放」會自己一步一步走；也可以自己按「下一步」。<a href="./">← 回遊戲</a></p>
  <nav id="eps"></nav>
  <h2 id="title"></h2>
  <span id="count"></span>
  <div class="track"><div id="bar"></div></div>
  <div id="screen">
    <div id="slide" hidden></div>
    <div id="ed" class="pane" hidden><header>📄 <span id="fname"></span></header><div id="code"></div></div>
    <div id="term" class="pane" hidden><header>⌨️ 終端機（綠色是你要打的指令）</header><div id="tout"></div></div>
    <div id="web" class="pane" hidden><header><span id="url"></span></header><div id="page"></div></div>
  </div>
</main>
<footer><div>
  <p id="say"></p>
  <div class="ctl"><button id="prev">⏮ 上一步</button><button id="play" class="primary">▶ 播放</button><button id="next">下一步 ⏭</button></div>
  <div class="ctl2"><button id="again">↻ 重播這一步</button><button id="voice">🔇 語音：關</button>
    <select id="speed" aria-label="速度"><option value="0.75">慢</option><option value="1" selected>正常</option><option value="1.5">快</option></select></div>
</div></footer>
<script type="module" src="src/nodevideo.js"></script>
</body>
</html>
