<!doctype html>
<meta charset="utf-8">
<title>smoke12</title>
<pre id="out">running…</pre>
<div id="box"></div>
<script type="module">
// 冒煙測試 12：六門課「第〇章 超簡單版」的每個教學小工具都能操作到過關
import { mountWidget } from './src/lab.js';
import { INTRO } from './src/courses-intro.js';
const log = [];
const show = () => (out.textContent = log.join('\n') + (log.some((l) => /FAIL|ERROR/.test(l)) ? '' : '\nALL OK'));
const ok = (c, m) => { log.push((c ? 'OK   ' : 'FAIL ') + m); show(); };
addEventListener('unhandledrejection', (e) => { log.push('ERROR ' + (e.reason?.stack || e.reason)); show(); });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const waitFor = async (fn, ms = 6000) => { for (let t = Date.now(); Date.now() - t < ms; await wait(100)) if (fn()) return true; return false; };
const WANT = { nd0a: /座位數：\s*3/, nd0b: /7600/, nd0c: /200[\s\S]*(400|300)/, nd0d: /資料來了/ };
for (const [cid, g] of Object.entries(INTRO)) {
  const ch = g.chapter;
  ok(ch.lessons.length === 4 && ch.quiz.length === 4 && !!g.event.text, cid + '：4 單元、4 題測驗、有小事件');
  for (const l of ch.lessons) {
    ok(l.steps.every((s) => s.say && (s.check || s.widget?.gate)), l.id + '：每步都有說明＋檢查或小工具');
    let n = 0;
    for (const st of l.steps) {
      for (const q of [st.check].filter(Boolean)) ok(q.options[q.answer] != null && q.options.length === 3, l.id + '：選擇題答案存在');
      const w = st.widget; if (!w) continue; n++;
      const d = document.createElement('div'); box.innerHTML = ''; box.append(d);
      let passed = false; mountWidget(d, w, () => (passed = true));
      if (w.type === 'explore') { [...d.querySelectorAll('.vbtns button')].forEach((_, i) => { d.querySelectorAll('.vbtns button')[i].click(); }); }
      else if (w.type === 'twlab') { for (const c of w.need) d.querySelector(`input[data-c="${c}"]`).click(); }
      else if (w.type === 'blanks') {
        d.querySelectorAll('select').forEach((s) => { s.value = String(w.blanks[+s.dataset.b].answer); s.dispatchEvent(new Event('change')); });
        d.querySelector('.chk').click();
      } else if (w.type === 'blocks') {
        // 先故意點錯順序一次
        if (w.lines.length > 1) { const b = [...d.querySelectorAll('.blk')]; b.find((x) => x.textContent.trim() === w.lines[1].code.trim()).click(); d.querySelector('.clr').click(); }
        for (const line of w.lines) [...d.querySelectorAll('.blk')].find((x) => !x.disabled && x.textContent.trim() === line.code.trim()).click();
        d.querySelector('.chk').click();
      }
      ok(await waitFor(() => passed), l.id + '：' + w.type + ' 做對後解鎖');
      if (WANT[l.id] && (w.type === 'blocks' || w.type === 'blanks')) ok(await waitFor(() => WANT[l.id].test(d.querySelector('.rres')?.textContent || '')), l.id + '：Node 程式真的執行，結果 ' + WANT[l.id]);
      if (w.output && (w.type === 'blocks' || w.type === 'blanks')) ok(await waitFor(() => (d.querySelector('.rres')?.textContent || '').includes(w.output.split('\n')[0])), l.id + '：顯示事先寫好的結果');
    }
    ok(n >= 1, l.id + '：至少一個小工具');
  }
}
show();
</script>
